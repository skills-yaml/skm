[package]
name = "skm"
version = "0.5.0"
edition = "2021"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
dirs = "5.0"
walkdir = "2.4"
sha2 = "0.10"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tempfile = "3.8"

[dev-dependencies]
serial_test = "3.0"
